spring.application.name=aura-store
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aura}
spring.datasource.username=${DATABASE_USERNAME:aura}
spring.datasource.password=${DATABASE_PASSWORD:aura_local_dev}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=32KB
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Administrador inicial (criado só se não existir nenhum). Troque em produção via variáveis de ambiente.
app.admin.email=${APP_ADMIN_EMAIL:admin@aura.dev}
app.admin.password=${APP_ADMIN_PASSWORD:AuraAdmin2026}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
